[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-graph-linter"
version = "0.1.2"
description = "Contract linter from the GRAPH-GRPO-LEX paper: checks, metrics and context slicing for contract graphs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Moriya Dechtiar" }]
keywords = ["contracts", "legal", "knowledge-graph", "linter", "graph-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["networkx>=2.8"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
contract-graph-linter = "contract_graph_linter.__main__:main"

[project.urls]
Repository = "https://github.com/moriyadechtiar/contract-graph-linter"
Paper = "https://doi.org/10.1109/ICDMW69685.2025.00092"
"Research code" = "https://github.com/moriyadechtiar/graph-grpo-lex"
Dataset = "https://huggingface.co/datasets/moriyad/contract-clause-graphs"

[tool.setuptools]
packages = ["contract_graph_linter", "contract_graph_linter.examples"]

[tool.setuptools.package-data]
"contract_graph_linter.examples" = ["*.json", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
